[package]
name = "magent-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "magent_cli"
path = "src/lib.rs"

[[bin]]
name = "magent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
magent-core = { path = "../magent-core" }
magent-distill = { path = "../magent-distill" }
magent-mcp = { path = "../magent-mcp" }
magent-store = { path = "../magent-store" }
magent-web = { path = "../magent-web" }
serde_json.workspace = true
uuid.workspace = true
rmcp.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
