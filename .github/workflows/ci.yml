name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.96.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The one way this repository runs its suite: a throwaway HOME, so a test
      # that forgets MAGENT_STATE_DIR cannot reach a real profile. Release, so
      # the PreCompact latency budget is asserted against what actually ships
      # rather than a debug build.
      - run: ./scripts/test.sh --release
      # Properties of the repository rather than the code: whether a clean
      # clone would actually install and run.
      - run: ./scripts/check-plugin.sh
