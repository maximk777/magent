name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.96.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Release, so the PreCompact latency budget is asserted against what
      # actually ships rather than a debug build.
      - run: cargo test --workspace --release
      # Isolation is otherwise unenforced: a test missing MAGENT_STATE_DIR
      # would silently write to a real profile.
      - run: ./scripts/check-isolation.sh
      # Properties of the repository rather than the code: whether a clean
      # clone would actually install and run.
      - run: ./scripts/check-plugin.sh
