[workspace]
resolver = "2"
members = ["crates/magent-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
rmcp = { version = "3.1", features = ["server", "macros", "schemars", "transport-io"] }
schemars = { version = "1.2", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.53", features = ["fs", "io-std", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.24", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
